name: Watch Cherry Apple

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-cherry-apple
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行上新监视
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: node watch.js

      - name: 提交最新快照（避免重复提醒）
        run: |
          git config user.name "cherry-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A .watcher
          if ! git diff --cached --quiet; then
            git commit -m "watcher: update snapshot [skip ci]"
            git push
          fi